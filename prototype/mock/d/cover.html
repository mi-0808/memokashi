<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>D ジャケット作成</title><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="header.css"><style>
.stage{display:flex;flex-direction:column;align-items:center;padding:22px 20px 8px}
.stage .jk{width:230px;height:230px;border-radius:18px;box-shadow:0 8px 22px var(--shadow-card)}
.cap{margin-top:14px;text-align:center}.cap b{display:block;font-size:17px;font-weight:800}.cap span{font-size:12px;font-weight:800;color:var(--sub-ink)}
.grp{padding:16px 20px 0}.grp .label{margin-bottom:10px}
.sw{display:flex;gap:10px}
.sw button{flex:1;height:48px;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(58,36,24,.12)}
.sw button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--main)}
.shp{display:flex;gap:10px}
.shp button{flex:1;height:60px;border-radius:12px;background:#fff;border:2px solid var(--line);position:relative}
.shp button.on{border-color:var(--main);box-shadow:0 0 0 2px var(--main)}
.shp i{position:absolute;display:block;background:var(--ink);left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px}
.inp{height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;display:flex;align-items:center;font-size:15px;font-weight:800}
.inp+.inp{margin-top:10px}.inp em{font-style:normal;color:var(--sub-ink);font-size:11px;margin-right:10px}
.foot .btn{width:100%;height:54px;border:0;box-shadow:none;background:var(--main);color:#fff;border-radius:14px;font-size:16px}
</style></head><body><div class="screen">
<div class="top"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="ttl"><div style="display:flex;align-items:center;gap:4px"><button class="back tap">‹</button><div><h1>ジャケット</h1><div class="sub">色と図形で、曲の顔をつくる</div></div></div></div></div>
<div class="body" style="padding-bottom:18px">
<div class="stage"><div class="jk" style="background:#FFD9BF"><span style="width:150px;height:150px;border-radius:50%;background:#FF7A2F;left:40px;top:54px"></span></div>
<div class="cap"><b>青信号を待つ時間</b><span>ミナト</span></div></div>
<div class="grp"><span class="label">背景の色</span><div class="sw"><button class="tap" style="background:#3A2418" aria-label="ink"></button><button class="tap" style="background:#FF7A2F" aria-label="main"></button><button class="tap on" style="background:#FFD9BF" aria-label="sub"></button><button class="tap" style="background:#8A5A3C" aria-label="sub-ink"></button><button class="tap" style="background:#FFF6EE" aria-label="bg"></button></div></div>
<div class="grp"><span class="label">図形</span><div class="shp">
<button class="tap on" aria-label="まる"><i style="border-radius:50%"></i></button>
<button class="tap" aria-label="さんかく"><i style="clip-path:polygon(50% 6%,96% 94%,4% 94%)"></i></button>
<button class="tap" aria-label="しかく"><i style="border-radius:3px"></i></button></div></div>
<div class="grp"><span class="label">図形の色</span><div class="sw"><button class="tap" style="background:#3A2418" aria-label="ink"></button><button class="tap on" style="background:#FF7A2F" aria-label="main"></button><button class="tap" style="background:#FFD9BF" aria-label="sub"></button><button class="tap" style="background:#8A5A3C" aria-label="sub-ink"></button><button class="tap" style="background:#FFF6EE" aria-label="bg"></button></div></div>
<div class="grp" style="padding-bottom:6px"><span class="label">曲名とアーティスト名</span><div class="inp">青信号を待つ時間</div><div class="inp"><em>Artist</em>ミナト</div></div>
</div>
<div class="foot"><button class="btn tap">この曲を保存する</button></div>
</div></body></html>
