<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../c/style.css">
<style>.hd{background:var(--main);padding:0 20px 16px}.hd h1{font-size:25px}.hd .sub{color:var(--ink)}.hd .statusbar{padding:0}.hd .sticker{height:44px;padding:0 16px;font-size:12px}.hero{background:var(--bg)!important;border-bottom:0!important;padding-top:22px!important}
.hero{flex:none;background:var(--sub);border-bottom:3px solid var(--ink);padding:0 18px 20px}
.hero .statusbar{padding:0}
.hero .row{display:flex;gap:16px;align-items:flex-end;padding-top:4px}
.hero .jk{width:128px;height:128px;border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);flex:none}
.hero h2{font-size:21px;font-weight:800;line-height:1.3}
.hero p{font-size:12px;font-weight:800;color:var(--sub-ink);margin-top:6px}
.hero .back{width:44px;height:44px;margin-left:-12px;font-size:22px;font-weight:800}
.acts{display:flex;gap:10px;padding:18px 18px 4px}
.acts .btn{flex:1}
.ly{margin:14px 18px;padding:20px;border-radius:14px}
.ly .label{margin-bottom:8px}
.ly p{font-size:16px;line-height:2.1}
.ly p+.label{margin-top:16px}
.src{margin:0 18px 26px;padding:14px 16px;border-radius:14px;background:var(--main);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.src h3{font-size:12px;font-weight:800;margin-bottom:8px;letter-spacing:.06em}
.src li{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding:9px 0}
.src li+li{border-top:2px dashed rgba(255,255,255,.55)}
.src li span{font-size:11px;font-weight:700;color:#FFF0E4}
</style></head><body>
<div class="screen">
<div class="hd"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="ttl"><div style="display:flex;align-items:center;gap:4px"><button class="back tap">‹</button><div><h1>曲詳細</h1><div class="sub">青信号を待つ時間</div></div></div><span class="sticker" style="background:var(--bg)">書き出す</span></div></div>
  <div class="hero">
    <div class="row"><div class="jk" style="background:#FFD9BF">
      <span style="width:128px;height:42px;background:#FF7A2F;left:0;top:24px"></span>
      <span style="width:42px;height:42px;border-radius:50%;background:#3A2418;left:43px;top:66px"></span>
      <span style="width:128px;height:6px;background:#3A2418;left:0;top:16px"></span></div>
      <div><h2>青信号を待つ時間</h2><p>ミナト ／ 2026年11月<br>12メモから</p></div></div></div>
  <div class="body">
    <div class="acts"><button class="btn tap">歌詞カードを保存</button><button class="btn alt tap" style="flex:0 0 90px">編集</button></div>
    <div class="ly box"><span class="label">1番</span>
      <p>帰り道 信号が青に<br>変わるのを待っていた<br>なんでもない時間が<br>ずっと残っていた</p>
      <span class="label">サビ</span><p>名前を呼ばれただけで<br>心臓がうるさくなるよ<br>好きって言葉はまだ<br>ポケットの中にあるよ</p>
      <span class="label">2番</span><p>改札の前で手をふった<br>そのあと少しだけ泣いた</p></div>
    <div class="src"><h3>この曲になった記憶</h3>
      <ul><li>2026.11.16<span>帰り道、信号が…</span></li><li>2026.11.09<span>名前を呼ばれた…</span></li>
      <li>2026.10.28<span>改札の前で手を…</span></li><li>2026.09.02<span>はじめて話した日</span></li></ul></div>
  </div>
</div></body></html>
