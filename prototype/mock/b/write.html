<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
body{background:var(--ink);color:#FFF6EE}
.top{background:none;padding:0 22px}
.rec{display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--main)}
.rec span{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--sub)}
.meta{display:flex;align-items:center;justify-content:space-between;padding:0 22px 16px}
.meta .date{font-size:13px;font-weight:800;color:var(--sub)}
.fold{height:44px;padding:0 16px;border-radius:22px;background:rgba(255,217,191,.16);color:#FFF6EE;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
.sheet{flex:1;padding:0 22px;font-size:19px;line-height:1.95;letter-spacing:.01em}
.sheet .ph{color:rgba(255,246,238,.38)}
.caret{display:inline-block;width:2px;height:22px;background:var(--main);vertical-align:-4px}
.foot{flex:none;padding:14px 22px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.foot .wave{color:var(--main);flex:1}
.foot .n{font-size:12px;font-weight:800;color:var(--sub)}
.close{height:44px;padding:0 20px;border-radius:22px;background:var(--main);color:#fff;font-weight:800;font-size:14px;display:inline-flex;align-items:center}
</style></head><body>
<div class="screen">
  <div class="top"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="rec"><span class="dot"></span><span>RECORDING — きみのこと</span></div></div>
  <div class="meta"><span class="date">2026.11.16 (月) 23:48</span><button class="fold tap">きみのこと ▾</button></div>
  <div class="sheet body">
    帰り道、信号が青になるのを<br>ふたりで黙って待っていた<br>なんでもない時間なのに<br>ずっと覚えている気がした<br>
    <span class="ph">また明日ね、の「また」が<span class="caret"></span></span>
  </div>
  <div class="foot">
    <div class="wave"><i style="height:8px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:12px"></i><i style="height:22px"></i><i style="height:28px"></i><i style="height:14px"></i><i style="height:9px"></i><i style="height:20px"></i><i style="height:25px"></i><i style="height:11px"></i><i style="height:17px"></i><i style="height:24px"></i><i style="height:8px"></i></div>
    <span class="n">62音</span><button class="close tap">閉じて保存</button>
  </div>
</div></body></html>
