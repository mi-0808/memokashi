<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.hero{background:var(--ink);padding:0 20px 22px;flex:none;text-align:center}
.hero .statusbar{color:#fff;padding:0}
.hero .jk{width:220px;height:220px;border-radius:8px;margin:6px auto 16px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.hero h2{font-size:22px;font-weight:800;color:#FFF6EE}
.hero p{font-size:12px;font-weight:700;color:var(--sub);margin-top:6px}
.hero .back{position:absolute;left:14px;top:46px;color:#fff;font-size:22px;font-weight:800;width:44px;height:44px}
.acts{display:flex;gap:10px;padding:16px 20px}
.acts .btn{flex:1}
.ly{margin:0 20px 16px;padding:22px;border-radius:16px;background:#fff;box-shadow:0 2px 10px rgba(138,90,60,.1)}
.ly h3{font-size:11px;font-weight:800;color:#fff;background:var(--main);display:inline-block;padding:4px 10px;border-radius:8px;letter-spacing:.08em;margin-bottom:10px}
.ly p{font-size:16px;line-height:2.15}
.ly p+h3{margin-top:20px}
.src{margin:0 20px 26px;padding:16px 18px;border-radius:16px;background:var(--sub)}
.src h3{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:10px}
.src li{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;padding:9px 0}
.src li+li{border-top:1px solid rgba(58,36,24,.12)}
.src li span{font-size:11px;font-weight:700;color:var(--sub-ink)}
</style></head><body>
<div class="screen">
  <div class="hero"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
    <button class="back tap">‹</button>
    <div class="jk" style="background:#3A2418">
      <span style="width:140px;height:140px;border-radius:50%;background:#FF7A2F;left:40px;top:40px"></span>
      <span style="width:38px;height:38px;border-radius:50%;background:#3A2418;left:91px;top:91px"></span>
      <span style="width:220px;height:5px;background:#FFD9BF;left:0;top:30px"></span>
      <span style="width:220px;height:5px;background:#FFD9BF;left:0;bottom:30px"></span></div>
    <h2>青信号を待つ時間</h2><p>ミナト ／ 2026年11月 ／ 12メモから</p></div>
  <div class="body">
    <div class="acts"><button class="btn tap">歌詞カードを保存</button><button class="btn alt tap" style="flex:0 0 90px">編集</button></div>
    <div class="ly"><h3>1番</h3>
      <p>帰り道 信号が青に<br>変わるのを待っていた<br>なんでもない時間が<br>ずっと残っていた</p>
      <h3>サビ</h3><p>名前を呼ばれただけで<br>心臓がうるさくなるよ<br>好きって言葉はまだ<br>ポケットの中にあるよ</p>
      <h3>2番</h3><p>改札の前で手をふった<br>そのあと少しだけ泣いた</p></div>
    <div class="src"><h3>この曲になった記憶</h3>
      <ul><li>2026.11.16<span>帰り道、信号が…</span></li><li>2026.11.09<span>名前を呼ばれた…</span></li>
      <li>2026.10.28<span>改札の前で手を…</span></li><li>2026.09.02<span>はじめて話した日</span></li></ul></div>
  </div>
</div></body></html>
