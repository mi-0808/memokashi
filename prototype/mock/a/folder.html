<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.stat{margin:4px 22px 12px;padding:14px 18px;border-radius:16px;display:flex;gap:26px}
.stat div b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.stat div span{font-size:11px;font-weight:800;color:var(--sub-ink)}
.day{padding:16px 22px 6px;font-size:12px;font-weight:800;color:var(--sub-ink)}
.memo{margin:0 22px 10px;padding:14px 16px;border-radius:16px;border-left:4px solid var(--sub)}
.memo p{font-size:15px;line-height:1.75}
.memo .m{margin-top:8px;font-size:11px;font-weight:800;color:var(--sub-ink);display:flex;gap:10px}
.memo .m em{font-style:normal;color:var(--main)}
.foot{flex:none;padding:12px 22px 26px;border-top:1px solid #F0E3D7;background:#FFFDFB}
.foot .pill{width:100%;height:52px;border-radius:26px;font-size:16px}
</style></head><body>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
  <div class="hd"><div style="display:flex;align-items:center;gap:6px"><button class="back tap">‹</button>
    <div><h1>きみのこと</h1><div class="sub">2026.09.02 から</div></div></div>
    <button class="tap" style="font-size:20px;color:var(--sub-ink)">…</button></div>
  <div class="body">
    <div class="stat paper"><div><b>18</b><span>メモ</span></div><div><b>236</b><span>総音数</span></div><div><b>42</b><span>行</span></div></div>
    <div class="day">11月16日</div>
    <div class="memo paper"><p>帰り道、信号が青になるのを<br>ふたりで黙って待っていた</p>
      <div class="m"><span>23:48</span><em>24音 ／ 2行</em></div></div>
    <div class="memo paper"><p>なんでもない時間なのに<br>ずっと覚えている気がした</p>
      <div class="m"><span>23:51</span><em>23音 ／ 2行</em></div></div>
    <div class="day">11月9日</div>
    <div class="memo paper"><p>名前を呼ばれただけで<br>心臓がうるさくなる</p>
      <div class="m"><span>01:12</span><em>21音 ／ 2行</em></div></div>
    <div class="memo paper"><p>好きって言葉は<br>まだポケットの中</p>
      <div class="m"><span>01:20</span><em>17音 ／ 2行</em></div></div>
    <div class="day">10月28日</div>
    <div class="memo paper" style="margin-bottom:24px"><p>改札の前で手をふった<br>そのあと少しだけ泣いた</p>
      <div class="m"><span>22:04</span><em>22音 ／ 2行</em></div></div>
  </div>
  <div class="foot"><button class="pill tap">♪ 一曲にする</button></div>
</div></body></html>
