<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.stats{display:flex;gap:10px;padding:12px 18px 4px;background:var(--bg)}
.stats div{flex:1;padding:8px 10px;text-align:center;border-radius:12px}
.stats b{display:block;font-size:20px;font-weight:800;line-height:1.2}
.stats span{font-size:10px;font-weight:800;color:var(--sub-ink)}
.day{padding:16px 18px 8px}
.memo{margin:0 18px 12px;padding:14px 16px;border-radius:14px}
.memo p{font-size:15px;line-height:1.75}
.memo .m{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;color:var(--sub-ink)}
.memo .m em{font-style:normal;background:var(--sub);border:2px solid var(--ink);border-radius:8px;padding:1px 8px;color:var(--ink)}
.foot{flex:none;padding:12px 18px 26px;background:var(--bg);border-top:3px solid var(--ink)}
.foot .btn{width:100%;height:54px;font-size:16px}
</style></head><body>
<div class="screen">
  <div class="hd"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="ttl"><div style="display:flex;align-items:center;gap:4px"><button class="back tap">‹</button>
    <div><h1>きみのこと</h1><div class="sub">2026.09.02 から</div></div></div></div></div>
  <div class="stats"><div class="box"><b>18</b><span>メモ</span></div><div class="box"><b>236</b><span>総音数</span></div><div class="box"><b>42</b><span>行</span></div></div>
  <div class="body" style="padding-top:2px">
    <div class="day"><span class="label">11/16</span></div>
    <div class="memo box"><p>帰り道、信号が青になるのを<br>ふたりで黙って待っていた</p><div class="m">23:48<em>24音</em></div></div>
    <div class="memo box"><p>なんでもない時間なのに<br>ずっと覚えている気がした</p><div class="m">23:51<em>23音</em></div></div>
    <div class="day"><span class="label">11/9</span></div>
    <div class="memo box"><p>名前を呼ばれただけで<br>心臓がうるさくなる</p><div class="m">01:12<em>21音</em></div></div>
    <div class="memo box"><p>好きって言葉は<br>まだポケットの中</p><div class="m">01:20<em>17音</em></div></div>
    <div class="day"><span class="label">10/28</span></div>
    <div class="memo box" style="margin-bottom:24px"><p>改札の前で手をふった<br>そのあと少しだけ泣いた</p><div class="m">22:04<em>22音</em></div></div>
  </div>
  <div class="foot"><button class="btn tap">♪ 一曲にする</button></div>
</div></body></html>
