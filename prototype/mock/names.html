<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>アプリ名の候補</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="d/palette.css">
<style>
*{box-sizing:border-box;margin:0}body{font-family:"M PLUS Rounded 1c",sans-serif;background:var(--bg);color:var(--ink);padding:28px 24px 60px;max-width:900px;margin:auto}
h1{font-size:22px;font-weight:800;margin-bottom:4px}.lead{font-size:13px;font-weight:700;color:var(--sub-ink);margin-bottom:22px}
.row{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;align-items:center}
.no{font-size:12px;font-weight:800;color:var(--sub-ink)}.rd{font-size:12px;font-weight:700;color:var(--sub-ink);margin-top:2px}
.lg{font-weight:800;letter-spacing:-.01em;font-size:30px;line-height:1.3}.lg b{color:var(--main)}
.on-cream{padding:14px 16px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.on-dark{padding:14px 16px;border-radius:12px;background:var(--ink);color:var(--bg)}
.on-dark .lg{}
.why{grid-column:1/-1;font-size:13px;font-weight:700;line-height:1.7}
.hdr{background:var(--main);border-bottom:3px solid var(--ink);border-radius:12px 12px 0 0}
@media(max-width:680px){.row{grid-template-columns:1fr}}
</style></head><body>
<h1>アプリ名の候補（ひらがな・漢字＋ひらがな）</h1>
<p class="lead">左：クリーム地 ／ 右：黒地（スプラッシュ・設定のカード）。前半こげ茶＋後半オレンジの形はそのまま。</p>
<div id="o"></div>
<script>
const N=[["かけら","うた","かけらうた","記憶のかけらを一曲にする、というコンセプトそのまま。やわらかく短い。"],
["ふと","うた","ふとうた","「ふと浮かんだ」言葉を、そのまま歌に。書くのが軽い印象。"],
["おもい","うた","おもいうた","想い＋歌。恋愛の気持ちを書き出す想定ユーザーに合う。"],
["記憶の","うた","記憶のうた","テーマ「記憶」がそのまま入る。漢字が入って意味が一目で伝わる。"],
["うたの","たね","うたのたね","歌になる前の言葉のかけら＝種。育てる感じがあり、ほのぼのする。"],
["歌詞","メモ","歌詞メモ","いちばんシンプルで、何のアプリか一目で分かる。「memo」の部分は元の名前のまま残る。"],
["メモ","歌詞","メモ歌詞","メモが歌詞になる、という流れそのまま。前半メモ＋後半オレンジの順が元のロゴ（memo→rhythm）と同じ。"]];
o.innerHTML=N.map(([a,b,r,w],i)=>`<div class="row"><div><div class="no">案${i+1}</div><div class="rd">${r}</div></div><div class="on-cream"><span class="lg">${a}<b>${b}</b></span></div><div class="on-dark"><span class="lg">${a}<b>${b}</b></span></div><p class="why">${w}</p></div>`).join("");
</script></body></html>
