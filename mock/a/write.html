<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>A 書く画面</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.wrap{flex:1;display:flex;flex-direction:column;padding:0 24px 0}
.meta{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.date{font-size:13px;font-weight:800;color:var(--sub-ink)}
.folder{height:44px;padding:0 16px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--sub);
  display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.folder em{font-style:normal;color:var(--main)}
.sheet{flex:1;padding:6px 2px 20px;font-size:17px;line-height:36px;letter-spacing:.01em}
.sheet .ph{color:#C8B2A2}
.foot{flex:none;padding:12px 24px 26px;display:flex;align-items:center;justify-content:space-between}
.count{font-size:12px;font-weight:800;color:var(--sub-ink)}
.caret{display:inline-block;width:2px;height:22px;background:var(--main);vertical-align:-4px;margin-left:1px}
</style></head><body>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
  <div class="hd"><div><h1 class="logotype">メモ<b>歌詞</b></h1><div class="sub">思いついたことを、そのまま。</div></div>
    <button class="tap pill ghost">閉じる</button></div>
  <div class="wrap">
    <div class="meta"><span class="date">2026年11月16日（月）23:48</span>
      <button class="tap folder"><em>きみのこと</em> ▾</button></div>
    <div class="sheet ruled body">
      帰り道、信号が青になるのを<br>
      ふたりで黙って待っていた<br>
      なんでもない時間なのに<br>
      ずっと覚えている気がした<br>
      <span class="ph">また明日ね、の「また」が<span class="caret"></span></span>
    </div>
  </div>
  <div class="foot"><span class="count">5行 ／ 62音</span><span class="count">閉じると自動で保存されます</span></div>
</div></body></html>
