<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.hero{padding:6px 22px 18px;display:flex;gap:16px;align-items:flex-end}
.hero .jk{width:132px;height:132px;border-radius:16px;flex:none;box-shadow:0 8px 20px rgba(138,90,60,.2)}
.hero h2{font-size:21px;font-weight:800;line-height:1.3}
.hero p{font-size:12px;font-weight:700;color:var(--sub-ink);margin-top:6px}
.acts{display:flex;gap:10px;padding:0 22px 16px}
.acts .pill{flex:1}
.card{margin:0 22px 14px;padding:20px 22px;border-radius:18px}
.card h3{font-size:12px;font-weight:800;color:var(--main);letter-spacing:.08em;margin-bottom:10px}
.card .ly{font-size:15px;line-height:2.1}
.card .ly+h3{margin-top:18px}
.dates{margin:0 22px 26px;padding:16px 18px;border-radius:18px}
.dates h3{font-size:12px;font-weight:800;color:var(--sub-ink);letter-spacing:.06em;margin-bottom:10px}
.dates li{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:8px 0}
.dates li+li{border-top:1px solid #F6ECE3}
.dates li span{color:var(--sub-ink);font-size:12px}
</style></head><body>
<div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
  <div class="hd"><button class="back tap">‹</button><button class="tap" style="font-size:13px;font-weight:800;color:var(--main)">書き出す</button></div>
  <div class="body">
    <div class="hero"><div class="jk" style="background:#FF7A2F">
      <span style="width:82px;height:82px;border-radius:50%;background:#FFD9BF;left:25px;top:18px"></span>
      <span style="width:132px;height:15px;background:#FFF6EE;left:0;bottom:25px"></span></div>
      <div><h2>青信号を待つ時間</h2><p>ミナト ／ 2026年11月<br>12メモから</p></div></div>
    <div class="acts"><button class="pill tap">歌詞カード</button><button class="pill ghost tap">編集</button></div>
    <div class="card paper"><h3>1番</h3>
      <p class="ly">帰り道 信号が青に<br>変わるのを待っていた<br>なんでもない時間が<br>ずっと残っていた</p>
      <h3>サビ</h3>
      <p class="ly">名前を呼ばれただけで<br>心臓がうるさくなるよ<br>好きって言葉はまだ<br>ポケットの中にあるよ</p>
      <h3>2番</h3>
      <p class="ly">改札の前で手をふった<br>そのあと少しだけ泣いた</p>
    </div>
    <div class="dates paper"><h3>この曲になった記憶</h3>
      <ul><li>2026.11.16<span>帰り道、信号が…</span></li>
        <li>2026.11.09<span>名前を呼ばれた…</span></li>
        <li>2026.10.28<span>改札の前で手を…</span></li>
        <li>2026.09.02<span>はじめて話した日</span></li></ul></div>
  </div>
</div></body></html>
