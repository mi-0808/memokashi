<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.sec{padding:18px 18px 4px;display:flex;align-items:center;justify-content:space-between}
.sec h2{font-size:15px;font-weight:800}
.row{display:flex;gap:14px;overflow:hidden;padding:10px 18px}
.c{width:144px;flex:none}
.c .jk{width:144px;height:144px;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
.c h3{font-size:13px;font-weight:800;margin-top:10px}
.c p{font-size:11px;font-weight:800;color:var(--sub-ink);margin-top:2px}
.fl{margin:8px 18px 0;padding:12px 14px;border-radius:14px;display:flex;align-items:center;gap:12px}
.cass{width:56px;height:38px;border:3px solid var(--ink);border-radius:6px;background:var(--sub);position:relative;flex:none}
.cass i{position:absolute;width:12px;height:12px;border:3px solid var(--ink);border-radius:50%;background:#fff;top:10px}
.fl b{font-size:14px;font-weight:800;display:block}
.fl em{font-style:normal;font-size:11px;font-weight:800;color:var(--sub-ink)}
.bar{height:10px;border:3px solid var(--ink);border-radius:6px;background:#fff;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 18px 90px}
.alb .jk{width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink)}
.alb h3{font-size:13px;font-weight:800;margin-top:9px}
.fab{position:absolute;left:18px;right:18px;bottom:86px;height:54px;border-radius:14px;background:var(--main);color:#fff;
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
</style></head><body>
<div class="screen">
  <div class="hd"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="ttl"><div><h1 class="logotype">メモ<b>歌詞</b></h1><div class="sub">6曲 ／ 2フォルダ制作中</div></div>
    <span class="sticker">14日つづけて書いた</span></div></div>
  <div class="body">
    <div class="sec"><h2>最近の曲</h2><span class="label">6</span></div>
    <div class="row">
      <div class="c"><div class="jk" style="background:#FFD9BF">
        <span style="width:144px;height:48px;background:#FF7A2F;left:0;top:30px"></span>
        <span style="width:48px;height:48px;border-radius:50%;background:#3A2418;left:48px;top:78px"></span></div>
        <h3>青信号を待つ時間</h3><p>12メモ</p></div>
      <div class="c"><div class="jk" style="background:#FFF6EE">
        <span style="width:60px;height:60px;background:#FF7A2F;left:14px;top:14px;border-radius:30px 0 30px 0"></span>
        <span style="width:60px;height:60px;background:#8A5A3C;right:14px;bottom:14px;border-radius:30px 0 30px 0"></span></div>
        <h3>傘をたたむ音</h3><p>9メモ</p></div>
      <div class="c"><div class="jk" style="background:#FF7A2F">
        <span style="width:144px;height:14px;background:#FFF6EE;left:0;top:34px"></span>
        <span style="width:144px;height:14px;background:#FFF6EE;left:0;top:66px"></span>
        <span style="width:144px;height:14px;background:#FFF6EE;left:0;top:98px"></span></div>
        <h3>まだ言えてない</h3><p>7メモ</p></div>
    </div>
    <div class="sec"><h2>制作中のフォルダ</h2></div>
    <div class="fl box"><div class="cass"><i style="left:8px"></i><i style="right:8px"></i></div>
      <div style="flex:1"><b>きみのこと</b><em>18メモ ／ 236音</em><div class="bar"><i style="width:72%"></i></div></div></div>
    <div class="fl box"><div class="cass" style="background:#FFF6EE"><i style="left:8px"></i><i style="right:8px"></i></div>
      <div style="flex:1"><b>夏のバイト終わり</b><em>6メモ ／ 74音</em><div class="bar"><i style="width:28%"></i></div></div></div>
    <div class="sec"><h2>アルバム</h2></div>
    <div class="alb">
      <div><div class="jk" style="background:#3A2418">
        <span style="width:100%;height:34px;background:#FF7A2F;left:0;top:28px"></span>
        <span style="width:100%;height:34px;background:#FFD9BF;left:0;bottom:28px"></span></div><h3>片想いの記録</h3></div>
      <div><div class="jk" style="background:#FFF6EE">
        <span style="width:70px;height:70px;border-radius:50%;border:12px solid #FF7A2F;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box"></span></div><h3>二年生の春</h3></div>
    </div>
  </div>
  <button class="fab tap">✎ 書く</button>
  <nav class="tabs"><a class="on"><span class="ic"></span>ライブラリ</a><a><span class="ic c"></span>フォルダ</a><a><span class="ic t"></span>カレンダー</a><a><span class="ic" style="border-radius:10px"></span>設定</a></nav>
</div></body></html>
