<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.hd{background:var(--main);color:#fff}
.hd .sub{color:#FFE7D6}
.meta{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px}
.date{font-size:12px;font-weight:800;color:var(--sub-ink)}
.fold{height:44px;padding:0 14px;border-radius:12px;background:#fff;border:3px solid var(--ink);font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.sheet{margin:0 18px;padding:18px;font-size:17px;line-height:1.95;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.ph{color:#C3AC9C}
.caret{display:inline-block;width:3px;height:20px;background:var(--main);vertical-align:-3px}
.foot{flex:none;padding:14px 18px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cnt{font-size:12px;font-weight:800;color:var(--sub-ink)}
.reel{display:flex;gap:10px;align-items:center}
.reel i{display:block;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--sub)}
</style></head><body>
<div class="screen">
  <div class="hd"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="ttl"><div><h1 class="logotype" style="color:#fff">メモ<b style="color:#FFD9BF">歌詞</b></h1>
    <div class="sub">いま浮かんだ言葉を、そのまま</div></div><span class="sticker" style="background:#fff;color:var(--ink)">閉じる</span></div></div>
  <div class="meta"><span class="date">2026.11.16 (月) 23:48</span><button class="fold tap">きみのこと ▾</button></div>
  <div class="body" style="padding-top:2px">
    <div class="sheet">帰り道、信号が青になるのを<br>ふたりで黙って待っていた<br>なんでもない時間なのに<br>ずっと覚えている気がした<br>
      <span class="ph">また明日ね、の「また」が<span class="caret"></span></span></div>
  </div>
  <div class="foot"><div class="reel"><i></i><i></i></div><span class="cnt">5行 ／ 62音 ／ 閉じると自動保存</span></div>
</div></body></html>
