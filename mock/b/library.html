<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.sec{padding:20px 20px 6px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:17px;font-weight:800}
.sec span{font-size:12px;font-weight:800;color:var(--main)}
.row{display:flex;gap:16px;overflow:hidden;padding:8px 20px}
.card2{width:160px;flex:none}
.card2 .jk{width:160px;height:160px;border-radius:10px;box-shadow:0 6px 18px rgba(138,90,60,.22)}
.card2 h3{font-size:14px;font-weight:800;margin-top:10px}
.card2 p{font-size:11px;font-weight:700;color:var(--sub-ink);margin-top:3px}
.fl{margin:8px 20px 0;padding:14px;border-radius:14px;display:flex;align-items:center;gap:14px}
.fl .mini{width:52px;height:52px;border-radius:8px;flex:none;position:relative;overflow:hidden;background:var(--sub)}
.fl .mini i{position:absolute;display:block}
.fl .t{flex:1}
.fl .t b{font-size:14px;font-weight:800;display:block}
.fl .t em{font-style:normal;font-size:11px;font-weight:700;color:var(--sub-ink)}
.bar{height:6px;border-radius:3px;background:#F3E4D8;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main)}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 20px 90px}
.alb .jk{width:100%;aspect-ratio:1;border-radius:10px}
.alb h3{font-size:13px;font-weight:800;margin-top:8px}
.alb p{font-size:11px;color:var(--sub-ink);font-weight:700}
.fab{position:absolute;right:18px;bottom:86px;width:60px;height:60px;border-radius:30px;background:var(--main);color:#fff;
  font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(255,122,47,.45)}
</style></head><body>
<div class="screen">
  <div class="top"><div class="statusbar" style="color:#fff;padding:0"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
    <div class="ttl"><div><h1 class="logotype" style="color:#fff">メモ<b style="color:#FFD9BF">歌詞</b></h1>
      <div class="sub">6曲 ／ 2フォルダ制作中</div></div><span class="chip">14日連続</span></div></div>
  <div class="body">
    <div class="sec"><h2>最近の曲</h2><span>すべて</span></div>
    <div class="row">
      <div class="card2"><div class="jk" style="background:#3A2418">
        <span style="width:160px;height:4px;background:#FF7A2F;left:0;top:52px"></span>
        <span style="width:160px;height:4px;background:#FFD9BF;left:0;top:72px"></span>
        <span style="width:100px;height:100px;border-radius:50%;background:#FF7A2F;left:30px;top:52px;mix-blend-mode:normal"></span>
        <span style="width:28px;height:28px;border-radius:50%;background:#3A2418;left:66px;top:88px"></span></div>
        <h3>青信号を待つ時間</h3><p>ミナト ／ 12メモ</p></div>
      <div class="card2"><div class="jk" style="background:#FFD9BF">
        <span style="width:160px;height:80px;background:#FF7A2F;left:0;bottom:0"></span>
        <span style="width:56px;height:56px;border-radius:50%;background:#FFF6EE;left:52px;top:52px"></span></div>
        <h3>傘をたたむ音</h3><p>ミナト ／ 9メモ</p></div>
      <div class="card2"><div class="jk" style="background:#FF7A2F">
        <span style="width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-top:90px solid #3A2418;left:0;bottom:0"></span></div>
        <h3>まだ言えてない</h3><p>ミナト ／ 7メモ</p></div>
    </div>
    <div class="sec"><h2>制作中</h2></div>
    <div class="fl card"><div class="mini"><i style="width:52px;height:18px;background:#FF7A2F;left:0;bottom:0"></i></div>
      <div class="t"><b>きみのこと</b><em>18メモ ／ 236音 ／ あと少し</em><div class="bar"><i style="width:72%"></i></div></div></div>
    <div class="fl card"><div class="mini" style="background:#3A2418"><i style="width:26px;height:26px;border-radius:50%;background:#FFD9BF;left:13px;top:13px"></i></div>
      <div class="t"><b>夏のバイト終わり</b><em>6メモ ／ 74音</em><div class="bar"><i style="width:28%"></i></div></div></div>
    <div class="sec"><h2>アルバム</h2></div>
    <div class="alb">
      <div><div class="jk" style="background:#FF7A2F">
        <span style="width:100%;height:50%;background:#FFD9BF;left:0;top:0"></span>
        <span style="width:60px;height:60px;border-radius:50%;background:#3A2418;left:50%;top:50%;transform:translate(-50%,-50%)"></span></div>
        <h3>片想いの記録</h3><p>4曲</p></div>
      <div><div class="jk" style="background:#8A5A3C">
        <span style="width:30px;height:100%;background:#FFD9BF;left:20px;top:0"></span>
        <span style="width:30px;height:100%;background:#FF7A2F;left:70px;top:0"></span></div>
        <h3>二年生の春</h3><p>3曲</p></div>
    </div>
  </div>
  <button class="fab tap">✎</button>
  <nav class="tabs"><a class="on"><span class="ic"></span>ライブラリ</a><a><span class="ic c"></span>フォルダ</a><a><span class="ic t"></span>カレンダー</a><a><span class="ic" style="border-radius:10px"></span>設定</a></nav>
</div></body></html>
