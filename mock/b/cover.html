<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css">
<style>
.stage{padding:24px 20px 18px;display:flex;flex-direction:column;align-items:center;background:var(--ink)}
.stage .jk{width:250px;height:250px;border-radius:8px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.stage .cap{margin-top:14px;text-align:center;color:#FFF6EE}
.stage .cap b{display:block;font-size:18px;font-weight:800}
.stage .cap span{font-size:12px;font-weight:700;color:var(--sub)}
.grp{padding:18px 20px 0}
.grp .label{display:block;margin-bottom:10px}
.sw{display:flex;gap:10px}
.sw button{flex:1;height:50px;border-radius:10px}
.sw button.on{outline:3px solid var(--main);outline-offset:3px}
.sh{display:flex;gap:10px;margin-top:4px}
.sh button{flex:1;height:62px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px #F0E3D7;position:relative;overflow:hidden}
.sh button.on{box-shadow:inset 0 0 0 3px var(--main)}
.sh i{position:absolute;display:block}
.seg2{display:flex;gap:8px}
.seg2 button{flex:1;height:44px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px #F0E3D7;font-size:13px;font-weight:800;color:var(--sub-ink)}
.seg2 button.on{background:var(--main);color:#fff;box-shadow:none}
.inp{height:50px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px #F0E3D7;padding:0 14px;display:flex;align-items:center;font-size:15px;font-weight:700}
.inp+.inp{margin-top:10px}
.inp em{font-style:normal;color:#C8B2A2;margin-right:10px;font-size:12px}
.foot{flex:none;padding:12px 20px 26px;background:#FFFDFB;border-top:1px solid #F0E3D7}
.foot .btn{width:100%;height:54px;font-size:16px}
</style></head><body>
<div class="screen">
  <div class="top" style="padding-bottom:12px"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
    <div class="ttl"><div style="display:flex;align-items:center;gap:4px"><button class="back tap">‹</button><h1>ジャケット</h1></div></div></div>
  <div class="body" style="padding-bottom:10px">
    <div class="stage"><div class="jk" style="background:#3A2418">
      <span style="width:160px;height:160px;border-radius:50%;background:#FF7A2F;left:45px;top:45px"></span>
      <span style="width:44px;height:44px;border-radius:50%;background:#3A2418;left:103px;top:103px"></span>
      <span style="width:250px;height:6px;background:#FFD9BF;left:0;top:36px"></span>
      <span style="width:250px;height:6px;background:#FFD9BF;left:0;bottom:36px"></span></div>
      <div class="cap"><b>青信号を待つ時間</b><span>ミナト</span></div></div>
    <div class="grp"><span class="label">素材</span><div class="seg2"><button class="on">色と図形</button><button>写真</button></div></div>
    <div class="grp"><span class="label">色</span><div class="sw">
      <button class="on" style="background:#3A2418"></button><button style="background:#FF7A2F"></button>
      <button style="background:#FFD9BF"></button><button style="background:#8A5A3C"></button><button style="background:#FFF6EE;box-shadow:inset 0 0 0 2px #F0E3D7"></button></div></div>
    <div class="grp"><span class="label">図形パターン</span><div class="sh">
      <button class="on"><i style="width:34px;height:34px;border-radius:50%;background:#FF7A2F;left:50%;top:14px;margin-left:-17px"></i></button>
      <button><i style="width:44px;height:7px;background:#FF7A2F;left:50%;margin-left:-22px;top:18px"></i><i style="width:44px;height:7px;background:#FFD9BF;left:50%;margin-left:-22px;top:34px"></i></button>
      <button><i style="width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:34px solid #FF7A2F;left:50%;margin-left:-20px;top:14px"></i></button>
      <button><i style="width:30px;height:30px;background:#FF7A2F;left:12px;top:16px"></i><i style="width:30px;height:30px;background:#FFD9BF;right:12px;top:16px"></i></button></div></div>
    <div class="grp" style="padding-bottom:20px"><span class="label">曲名とアーティスト名</span>
      <div class="inp">青信号を待つ時間</div><div class="inp"><em>Artist</em>ミナト</div></div>
  </div>
  <div class="foot"><button class="btn tap">この曲を保存する</button></div>
</div></body></html>
