<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>D 書く</title><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css"><style>
body{background:var(--ink);color:#FFF6EE}
.meta{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 22px 16px}
.round{width:44px;height:44px;border-radius:22px;color:#FFF6EE;background:rgba(255,217,191,.16);border:2px solid rgba(255,217,191,.5);display:flex;align-items:center;justify-content:center}
.fold{height:44px;padding:0 16px;border-radius:22px;background:rgba(255,217,191,.16);border:2px solid rgba(255,217,191,.5);color:#FFF6EE;font-size:14px;font-weight:800;display:inline-flex;align-items:center}
.sheet{flex:1;padding:0 22px;font-size:19px;line-height:1.95}
.ph{color:rgba(255,246,238,.45)}
.caret{display:inline-block;width:2px;height:22px;background:var(--main);vertical-align:-4px}
.ft{flex:none;padding:14px 22px 26px;display:flex;align-items:center;gap:14px}
.ft .wave{color:var(--main);flex:1;height:28px}
.ft .n{flex:1;font-size:14px;font-weight:800;color:var(--sub)}
.ft .btn{height:50px;border:0;box-shadow:none;background:var(--main);color:#fff;border-radius:14px;font-size:15px}
</style></head><body><div class="screen">
<div style="padding:0 22px"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div></div>
<div class="meta"><button class="round tap" aria-label="戻る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button class="fold tap">きみのこと ▾</button></div>
<div class="sheet body">帰り道、信号が青になるのを<br>ふたりで黙って待っていた<br>なんでもない時間なのに<br>ずっと覚えている気がした<br><span class="ph">また明日ね、の「また」が<span class="caret"></span></span></div>
<div class="ft"><span class="n">5行 ／ 62音</span><button class="btn tap">閉じて保存</button></div>
</div></body></html>
