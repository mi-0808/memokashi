<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>T</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../b/style.css"><link rel="stylesheet" href="header.css">
<style>
.stats{display:flex;gap:10px;padding:14px 0 2px}
.stats div{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 14px}
.stats b{display:block;font-size:20px;font-weight:800;line-height:1.2}
.stats span{font-size:10px;font-weight:800;opacity:.9}
.day{padding:18px 20px 8px;font-size:12px;font-weight:800;color:var(--sub-ink);display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:#F0E3D7}
.memo{margin:0 20px 10px;padding:14px 16px;border-radius:14px;display:flex;gap:12px}
.memo .wave{color:var(--sub);flex:none;height:44px;align-items:center}
.memo p{font-size:15px;line-height:1.75;flex:1}
.memo .m{margin-top:8px;font-size:11px;font-weight:800;color:var(--sub-ink)}
.memo .m em{font-style:normal;color:var(--main)}
.foot{flex:none;padding:12px 20px 26px;background:#FFFDFB;border-top:1px solid #F0E3D7}
.foot .btn{width:100%;height:54px;font-size:16px}
</style></head><body>
<div class="screen">
  <div class="top"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div>
    <div class="ttl"><div style="display:flex;align-items:center;gap:4px"><button class="back tap">‹</button>
      <div><h1>きみのこと</h1><div class="sub">2026.09.02 から ／ 42行</div></div></div></div>
    <div class="stats"><div><b>18</b><span>メモ</span></div><div><b>236</b><span>総音数</span></div><div><b>5</b><span>韻の候補</span></div></div></div>
  <div class="body">
    <div class="day">11月16日</div>
    <div class="memo card"><div class="wave"><i style="height:10px"></i><i style="height:22px"></i><i style="height:14px"></i><i style="height:26px"></i></div>
      <div><p>帰り道、信号が青になるのを<br>ふたりで黙って待っていた</p><div class="m">23:48 ／ <em>24音</em></div></div></div>
    <div class="memo card"><div class="wave"><i style="height:18px"></i><i style="height:9px"></i><i style="height:24px"></i><i style="height:13px"></i></div>
      <div><p>なんでもない時間なのに<br>ずっと覚えている気がした</p><div class="m">23:51 ／ <em>23音</em></div></div></div>
    <div class="day">11月9日</div>
    <div class="memo card"><div class="wave"><i style="height:24px"></i><i style="height:12px"></i><i style="height:20px"></i><i style="height:8px"></i></div>
      <div><p>名前を呼ばれただけで<br>心臓がうるさくなる</p><div class="m">01:12 ／ <em>21音</em></div></div></div>
    <div class="memo card"><div class="wave"><i style="height:11px"></i><i style="height:26px"></i><i style="height:15px"></i><i style="height:19px"></i></div>
      <div><p>好きって言葉は<br>まだポケットの中</p><div class="m">01:20 ／ <em>17音</em></div></div></div>
    <div class="day">10月28日</div>
    <div class="memo card" style="margin-bottom:24px"><div class="wave"><i style="height:16px"></i><i style="height:22px"></i><i style="height:10px"></i><i style="height:25px"></i></div>
      <div><p>改札の前で手をふった<br>そのあと少しだけ泣いた</p><div class="m">22:04 ／ <em>22音</em></div></div></div>
  </div>
  <div class="foot"><button class="btn tap">♪ 一曲にする</button></div>
</div></body></html>
