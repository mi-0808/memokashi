<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>D</title><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="style.css"><style>.plate{display:inline-block;background:var(--ink);color:var(--bg);border-radius:14px;padding:3px 16px 6px;font-size:24px;line-height:1.35;margin-bottom:4px}
.sec{padding:20px 20px 4px;display:flex;align-items:center;justify-content:space-between}
.sec h2{font-size:17px;font-weight:800}.sec span.m{font-size:12px;font-weight:800;color:var(--sub-ink)}
.row{display:flex;gap:16px;overflow:hidden;padding:8px 20px}
.c{width:160px;flex:none}
.c .jk{width:160px;height:160px;border-radius:12px;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.c h3{font-size:14px;font-weight:800;margin-top:12px}.c p{font-size:11px;font-weight:700;color:var(--sub-ink);margin-top:2px}
.fl{margin:8px 20px 0;padding:12px 14px;display:flex;align-items:center;gap:14px}
.cass{width:56px;height:40px;border:2px solid var(--ink);border-radius:7px;background:var(--sub);position:relative;flex:none}
.cass i{position:absolute;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:#fff;top:11px}
.fl b{font-size:14px;font-weight:800;display:block}.fl em{font-style:normal;font-size:11px;font-weight:800;color:var(--sub-ink)}
.bar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--main)}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 20px 100px}
.alb .jk{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid var(--ink)}.alb h3{font-size:13px;font-weight:800;margin-top:8px}
.fab{position:absolute;right:18px;bottom:88px;height:56px;padding:0 22px}
</style></head><body><div class="screen">
<div class="top"><div class="statusbar"><span>9:41</span><span class="right"><i></i><i style="width:10px"></i></span></div><div class="ttl"><div><h1 style="display:flex;align-items:center;gap:10px"><img src="../../assets/logo.svg" alt="" style="width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;display:block">ライブラリ</h1><div class="sub">6曲 ／ 2フォルダ制作中</div></div><span class="chip">14日連続</span></div></div>
<div class="body">

 <div class="c"><div class="jk" style="background:#FF7A2F"><span style="width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-top:90px solid #3A2418;left:0;bottom:0"></span></div><h3>まだ言えてない</h3><p>ミナト ／ 7メモ</p></div>

<div><div class="jk" style="background:#8A5A3C"><span style="width:30px;height:100%;background:#FFD9BF;left:20px;top:0"></span><span style="width:30px;height:100%;background:#FF7A2F;left:70px;top:0"></span></div><h3>二年生の春</h3></div></div>
</div>
